name: Motwane Production Infrastructure Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: envs/prod

env:
  TF_VAR_admin_username: ${{ secrets.TF_VAR_ADMIN_USERNAME }}
  TF_VAR_admin_password: ${{ secrets.TF_VAR_ADMIN_PASSWORD }}

jobs:

  validate:
    name: Validate Terraform Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

  plan:
    name: Plan Network + ADDS + VPN Gateway
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: envs/prod/tfplan

  deploy:
    name: Deploy Production Infrastructure (Network + ADDS + VPN Gateway)
    runs-on: ubuntu-latest
    needs: plan

    environment:
      name: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: envs/prod

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  validation:
    name: Post Deployment Validation
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Deployment Summary
        working-directory: .
        run: echo "Motwane Production Infrastructure Deployment Completed Successfully"
