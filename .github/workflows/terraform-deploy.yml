name: Motwane Production Infrastructure Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  validate:
    name: Validate Terraform Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

  plan:
    name: Plan Network + ADDS + VPN Gateway
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan

  deploy:
    name: Deploy Production Infrastructure (Network + ADDS + VPN Gateway)
    runs-on: ubuntu-latest
    needs: plan

    environment:
      name: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  validation:
    name: Post Deployment Validation
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Deployment Summary
        run: |
          echo "===================================="
          echo "Motwane Production Deployment"
          echo "===================================="
          echo "✓ Virtual Network Provisioned"
          echo "✓ Public, Private and AD Subnets Created"
          echo "✓ GatewaySubnet Created"
          echo "✓ Active Directory Domain Services Installed"
          echo "✓ VNet DNS Updated"
          echo "✓ VPN Gateway Deployed"
          echo "===================================="
